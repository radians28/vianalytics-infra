# Production stack for a dedicated VPS.
#
#   https://app.your-domain.com            -> ui      (static React app)
#   https://app.your-domain.com/api/*      -> api     (Flask API)
#   https://app.your-domain.com/airflow/*  -> airflow (scheduled jobs + web UI)
#   Postgres                               -> VPS loopback only (127.0.0.1:5432),
#                                             reached through an SSH tunnel:
#       ssh -N -L 5432:127.0.0.1:5432 user@app.your-domain.com
#
# Publicly exposed ports on the VPS: 80/tcp, 443/tcp+udp (Caddy), plus SSH.
# Everything else is only on internal Docker networks; db is bound to loopback.
#
#   docker compose up -d --build
#   docker compose up -d --scale api=3
#
# Database: install a new one or use an existing Postgres (set in .env)
#   new      COMPOSE_PROFILES=local-db  DB_HOST=db  -> starts the "db" service below
#   existing COMPOSE_PROFILES=          DB_HOST=<existing host>  -> "db" is not started;
#            every service connects to DB_HOST:DB_PORT (see "Database" in .env.example)

x-svc: &svc
  image: vianalytics-svc:latest
  build: ./vianalytics-svc
  restart: unless-stopped
  volumes:
    # svc runs as uid 10001; on Linux: sudo chown -R 10001:10001 ./uploads
    - ./uploads:/data/uploads
  # Lets DB_HOST=host.docker.internal reach a Postgres published on the Docker host
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
      # Only waited for when the local-db profile is active (new database)
      required: false

# Overrides that every svc variant shares (YAML merge is shallow, so each
# service re-declares `environment` with this merged in)
# All svc settings come from the root .env (see .env.example); the svc's own
# .env is excluded from the image by .dockerignore.
x-svc-env: &svc-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB}
  CORS_ORIGINS: https://${DOMAIN}
  # Required: the API refuses to start without it
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  # Matches the "uploads" volume mount below
  UPLOAD_FOLDER: /data/uploads
  TZ: Asia/Jakarta
  # Seeded after migrations (skipped when SEED_ADMIN_PASSWORD is empty)
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@admin.com}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

# Shared by every Airflow component
x-airflow: &airflow
  image: vianalytics-airflow:${AIRFLOW_VERSION:-3.3.2}
  build:
    context: ./airflow
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.3.2}
      PYTHON_VERSION: ${AIRFLOW_PYTHON_VERSION:-3.13}
  restart: unless-stopped
  # On Linux set AIRFLOW_UID=$(id -u) in .env so ./airflow/logs is writable
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    airflow-init:
      condition: service_completed_successfully

x-airflow-env: &airflow-env
  TZ: Asia/Jakarta
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
  # New DAGs start running without a manual unpause in the UI
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  # Airflow's own metadata lives in a separate database on the same server
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/${AIRFLOW_DB_NAME:-airflow}
  # Served under https://DOMAIN/airflow (Caddy forwards the path unchanged)
  AIRFLOW__API__BASE_URL: https://${DOMAIN}/airflow
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY}
  # Task runners report back to the api-server over the internal network
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/airflow/execution/
  # Connection "vianalytics_db" used by the DAGs to write to the app database
  AIRFLOW_CONN_VIANALYTICS_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB}

services:
  # ---- public entry: TLS + routing ----
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data       # certificates; keep this folder
      - ./caddy_config:/config
    networks: [edge]
    depends_on:
      - ui

  ui:
    image: vianalytics-ui:latest
    build:
      context: ./vianalytics-ui
      args:
        # Baked into the bundle at build time; "/api" is same-origin via Caddy.
        # Rebuild the ui image after changing it.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    networks: [edge]

  # ---- API: migrate once, then serve (scalable) ----
  migrate:
    <<: *svc
    restart: "no"
    environment:
      <<: *svc-env
      SVC_ROLE: migrate
    networks: [backend, dbnet]

  api:
    <<: *svc
    environment:
      <<: *svc-env
      SVC_ROLE: api
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    networks: [edge, backend, dbnet]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ---- Airflow: scheduled jobs (DAGs in ./airflow/dags) ----
  # Creates the "airflow" database if missing, migrates it, creates the admin
  airflow-init:
    <<: *airflow
    restart: "no"
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        python - <<'EOF'
        import os, sys, psycopg2
        from psycopg2 import sql
        name = os.environ["AIRFLOW_DB_NAME"]
        try:
            conn = psycopg2.connect(host=os.environ["DB_HOST"], port=os.environ["DB_PORT"],
                                    user=os.environ["POSTGRES_USER"],
                                    password=os.environ["POSTGRES_PASSWORD"],
                                    dbname=os.environ["POSTGRES_DB"], connect_timeout=10)
        except psycopg2.OperationalError as e:
            sys.exit("Cannot reach Postgres at %s:%s (check DB_HOST / DB_PORT / credentials): %s"
                     % (os.environ["DB_HOST"], os.environ["DB_PORT"], e))
        conn.autocommit = True
        with conn.cursor() as cur:
            cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (name,))
            if not cur.fetchone():
                try:
                    cur.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(name)))
                    print("Created database '%s'" % name)
                except psycopg2.errors.InsufficientPrivilege:
                    sys.exit("User %s may not create databases. On the existing server run "
                             "CREATE DATABASE %s OWNER %s; (or GRANT CREATEDB) and retry."
                             % (os.environ["POSTGRES_USER"], name, os.environ["POSTGRES_USER"]))
        EOF
        exec /entrypoint airflow version
    environment:
      <<: *airflow-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    networks: [backend, dbnet]
    depends_on:
      db:
        condition: service_healthy
        required: false

  airflow-apiserver:
    <<: *airflow
    command: api-server
    environment: *airflow-env
    networks: [edge, backend, dbnet]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/airflow/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    environment: *airflow-env
    networks: [backend, dbnet]

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    environment: *airflow-env
    networks: [backend, dbnet]

  # ---- database: bound to the VPS's loopback, never a public interface ----
  # Started only with the "local-db" profile (COMPOSE_PROFILES=local-db in .env).
  # Leave the profile off to use an existing Postgres via DB_HOST / DB_PORT.
  db:
    image: postgres:16-alpine
    profiles: [local-db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Jakarta
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      # 127.0.0.1 only: reachable from the VPS itself (and so through an SSH
      # tunnel), not from the internet. Don't drop the 127.0.0.1 prefix.
      - "127.0.0.1:${DB_TUNNEL_PORT:-5432}:5432"
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  # Caddy <-> ui / api / airflow-apiserver
  edge: {}
  # api / airflow <-> db (local-db profile)
  backend: {}
  # api / airflow <-> an existing Postgres container on the same Docker host.
  # Existing DB: DB_NETWORK=<network the Postgres container is attached to>,
  # DB_NETWORK_EXTERNAL=true. New DB: leave the defaults (an unused local network).
  dbnet:
    name: ${DB_NETWORK:-vianalytics_dbnet}
    external: ${DB_NETWORK_EXTERNAL:-false}
